<!DOCTYPE html>
<html>
<head>
  <title>GPS Location Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    input, button {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 300px;
    }
  </style>
</head>
<body>
  <h2>Submit Your Location</h2>

  <form id="gpsForm">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <input type="text" id="latitude" placeholder="Latitude" readonly required>
    <input type="text" id="longitude" placeholder="Longitude" readonly required>

    <button type="button" id="getLocation">📍 Get My Location</button>
    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById('gpsForm');
    const latInput = document.getElementById('latitude');
    const lonInput = document.getElementById('longitude');
    const statusText = document.getElementById('status');

    // Get location on button click (mobile compatible)
    document.getElementById('getLocation').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            latInput.value = position.coords.latitude;
            lonInput.value = position.coords.longitude;
            statusText.innerText = "✅ Location captured.";
          },
          (error) => {
            statusText.innerText = "❌ Location access denied or failed.";
          }
        );
      } else {
        statusText.innerText = "Geolocation is not supported on this device.";
      }
    });

    // Submit form
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        latitude: latInput.value,
        longitude: lonInput.value
      };

      fetch('https://script.google.com/macros/s/AKfycbz6QhfKoFPjLUnjjVHFzdNegEH1bwjh_ZqrR2fHJqNTWGS12RSga1DdmZfim96hpJ_wQw/exec', {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      });

      statusText.innerText = "✅ Form submitted!";
      form.reset();
    });
  </script>
</body>
</html>
